name: Groupalia
description: 'Groupalia was a Spanish group-buying / daily-deals company (a Groupon-style
  local commerce marketplace) founded in 2010 and backed by investors including Insight
  Partners, operating across Spain, Italy and parts of Latin America before consolidating
  in the group-buying downturn. The brand''s only active surface today is the Italian
  domain groupalia.it, a gift-card storefront whose checkout is operated by EPIPOLI
  S.p.A. (mygiftcard.it); the original www.groupalia.com domain no longer resolves.
  No public API, developer portal, SDKs, or agent-facing surface is published, so this
  profile remains a consumer-company identity record rather than an API provider.'
